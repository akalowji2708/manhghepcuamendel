function askTF(){const q=Q[3],v=[null,null,null,null];show(hdr(cur)+'<p class="q">'+q.q+'</p>'+body(q,1)+'<div class="fb" id="fb" aria-live="polite"></div><div class="row"><button class="btn" id="ck">Nộp bài</button></div>');
let sent=0,sub;const el=timer(15,()=>sub());
sub=()=>{if(sent)return;sent=1;const e=el();stopT();$('#ck').disabled=1;document.querySelectorAll('.tf button').forEach(b=>b.disabled=1);const c=q.tf.filter((x,k)=>v[k]===x[1]).length,gn=Math.round(c*300*(1-.9*Math.min(e,15)/15));let net=gn;if(gn)award(cur,gn);if(c<=1){const p=pen(15,e,1000);net-=p;award(cur,-p)}
if(c==4){SFX.ok();setTimeout(()=>win(4),900)}else wrong('Chưa đủ 4 ý đúng ('+(net>=0?'+':'−')+Math.abs(net)+' điểm).')};
document.querySelectorAll('tr[data-k]').forEach(rw=>rw.querySelectorAll('button').forEach(b=>b.onclick=()=>{if(sent)return;v[+rw.dataset.k]=+b.dataset.v;rw.querySelectorAll('button').forEach(x=>x.classList.toggle('sel',x==b))}));$('#ck').onclick=sub}
function win(s){SFX.piece();mode='idle';done[s]=1;rev[s-1]=1;hud();show('<h2>Chính xác!</h2><p class="q" style="text-align:center">'+log.map(l=>l.e.n+' '+(l.p>=0?'+':'−')+Math.abs(l.p)).join(' · ')+'</p>'+BC+lbT(5)+'<div class="row"><button class="btn" id="bk">'+(s==4?'Xem bức tranh':'Tiếp tục')+'</button></div>');puz($('#pc').getContext('2d'),s-1);$('#pc').classList.add('pop');$('#bk').onclick=()=>{hide();if(s==4)fin()};$('#bk').focus()}
function fin(){SFX.finale();show('<h2>Bức tranh đã hoàn chỉnh!</h2>'+BC+'<div class="row"><button class="btn" id="vd">Vinh danh quán quân</button></div>');puz($('#pc').getContext('2d'));$('#pc').classList.add('pop');$('#vd').onclick=startPod}
function reset(){SFX.setMusic('main');SFX.scene(0);stopT();sc=0;acc=0;n=0;ex=[];done=[0,0,0,0,0];rev=[0,0,0,0];tr=null;mode='idle';pod=0;cur=null;fw=[];lv.style.display='none';$('#lbb').style.display='none';$('#chb').style.display='none';hud();mission()}
$('#rs').onclick=reset;hud();mission();
